workflows:
  ios-unsigned-ipa:
    name: iOS unsigned IPA
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      vars:
        XCODE_PROJECT: ThreeOneOSFive.xcodeproj
        XCODE_SCHEME: "3105"
    scripts:
      - name: Show Xcode version
        script: xcodebuild -version
      - name: Build unsigned iOS app
        script: |
          set -euo pipefail
          xcodebuild \
            -project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$CM_BUILD_DIR/build/codemagic-derived-data" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build
      - name: Package unsigned IPA
        script: |
          set -euo pipefail
          APP_PATH="$CM_BUILD_DIR/build/codemagic-derived-data/Build/Products/Release-iphoneos/3105.app"
          test -d "$APP_PATH"
          PACKAGE_DIR="$CM_BUILD_DIR/build/ipa"
          mkdir -p "$PACKAGE_DIR/Payload"
          cp -R "$APP_PATH" "$PACKAGE_DIR/Payload/3105.app"
          (cd "$PACKAGE_DIR" && /usr/bin/zip -qry "$CM_BUILD_DIR/build/3105-unsigned.ipa" Payload)
          /usr/bin/unzip -t "$CM_BUILD_DIR/build/3105-unsigned.ipa"
    artifacts:
      - build/3105-unsigned.ipa
      - /tmp/xcodebuild_logs/*.log
